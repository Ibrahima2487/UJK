{% extends 'membre_base.html' %}

{% block content %}

<style>
    label{
        color : black;
        padding: 5px;
        font-weight: bold;
    }
    input{
        border : 1px solid rgba(0, 0, 0, 0.883);
        padding: 5px;
    }
    textarea{
        border : 1px solid black;
        padding: 5px;
    }
</style>

<div class="max-w-4xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    

    <!-- Form Container -->
    <div class="bg-white rounded-2xl shadow-lg border border-blue-800 overflow-hidden">
        <!-- Form Header -->
        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-100 rounded-lg">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                </div>
                <div>
                    <h6 class="text-lg font-semibold text-gray-800">Publié une témoignage d'un(e) béneficiant(e) </h6>
                    <!-- <p class="text-sm text-gray-600">Ajouté une image à votre profile pour que la communauté UJK vous reconnaissent </p> -->
                </div>
            </div>
        </div>

        <!-- Form -->
        <form method="post" enctype="multipart/form-data" class="p-6 space-y-6 text-blue-800 border border-gray-400 ">
            {% csrf_token %}
            
            {{ form.as_p }}

            <!-- Form Actions -->
            <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-200">
                <button type="submit" class="inline-flex items-center justify-center gap-2 px-8 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5 flex-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    Publier
                </button>
                <a href="{% url 'trone' %}" class="inline-flex items-center justify-center gap-2 px-8 py-3 bg-white border border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 hover:shadow-md transition-all duration-300 flex-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                    Annuler
                </a>
            </div>
        </form>
    </div>
</div>


{% endblock %}
