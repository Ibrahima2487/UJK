<div class="bg-white rounded-lg">
    <!-- Header du modal -->
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900">Nouveau Message</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition duration-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
    
    <!-- Formulaire -->
    <form method="post" action="{% url 'message_create' %}" enctype="multipart/form-data" class="p-4 space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Message</label>
            <textarea 
                name="contenu" 
                rows="4" 
                placeholder="Écrivez votre message..." 
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent resize-none"
            ></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Fichier joint (optionnel)</label>
            <input type="file" name="fichier" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent">
        </div>

        <div class="flex justify-end space-x-3 pt-4">
            <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800 font-medium transition duration-200">
                Annuler
            </button>
            <button type="submit" class="bg-teal-500 hover:bg-teal-600 text-white px-4 py-2 rounded-lg font-medium transition duration-200">
                Envoyer
            </button>
        </div>
    </form>
</div>
