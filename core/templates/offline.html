{% extends "membre_base.html" %}
{% load static %}

{% block title %}UJK{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full text-center bg-white rounded-2xl shadow-md p-8 border border-gray-100">
    <div class="mx-auto mb-6 w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m-3.536-3.536a4 4 0 010-5.656M12 12h.01M3 3l18 18" />
      </svg>
    </div>

    <h1 class="text-xl font-semibold text-gray-900 mb-2">
      Pas de connexion
    </h1>
    <p class="text-gray-500 mb-6">
      Cette page n'est pas disponible hors ligne. Certaines pages déjà visitées restent accessibles.
    </p>

    <button
      onclick="window.location.reload()"
      class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition-colors"
    >
      Réessayer
    </button>
  </div>
</div>
{% endblock %}
